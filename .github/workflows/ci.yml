name: RioOS CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld python3
      - name: Clean build and regression tests
        run: bash ./linux/build.sh --clean
      - name: Confirm release artifacts
        run: |
          test -s build/kernel.elf
          test -s build/user_init.elf
          python3 tests/verify_release.py
